name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The current ubuntu-latest image has no Python 3.9 build in
          # setup-python, so keep 3.9 on the older LTS image.
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.10"
            os: ubuntu-latest
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the interpreters used by the dynamic stage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby php-cli

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest

      - name: Check the CLI
        run: |
          debian-redos --version
          debian-redos analyze-pattern '^(a+)+$' --language python --json > /dev/null
